name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build production bundle
        run: npm run build

      - name: Prepare SPA fallback and .nojekyll
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Upload dist artifact for gh-pages branch
        uses: actions/upload-artifact@v4
        with:
          name: dist-bundle
          path: ./dist
          include-hidden-files: true

      - name: Setup Pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Wait for legacy branch Pages build if active
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node - <<'EOF'
          const repo = process.env.GITHUB_REPOSITORY;
          const sha = process.env.GITHUB_SHA;
          const token = process.env.GITHUB_TOKEN;
          const headers = {
            Accept: 'application/vnd.github+json',
            'User-Agent': 'webpearll-pages-deploy',
            ...(token ? { Authorization: `Bearer ${token}` } : {}),
          };
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          (async () => {
            await sleep(5000);
            for (let attempt = 1; attempt <= 45; attempt++) {
              try {
                const res = await fetch(
                  `https://api.github.com/repos/${repo}/actions/runs?head_sha=${sha}&per_page=20`,
                  { headers }
                );
                if (!res.ok) {
                  console.log(`GitHub API responded with ${res.status}; proceeding.`);
                  break;
                }
                const data = await res.json();
                const legacyRuns = (data.workflow_runs || []).filter(
                  (run) =>
                    run.name === 'pages build and deployment' ||
                    (run.path && run.path.startsWith('dynamic/pages/'))
                );
                if (legacyRuns.length === 0) {
                  console.log('Pages source is GitHub Actions (no legacy branch build). Proceeding.');
                  break;
                }
                const running = legacyRuns.filter((run) => run.status !== 'completed');
                if (running.length === 0) {
                  console.log('Legacy branch Pages build finished; waiting 6s buffer before deploying dist...');
                  await sleep(6000);
                  break;
                }
                console.log(
                  `Attempt ${attempt}/45: Waiting for legacy "pages build and deployment" to complete...`
                );
              } catch (err) {
                console.log('Check error, proceeding:', err);
                break;
              }
              await sleep(4000);
            }
          })();
          EOF

  publish-gh-pages:
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-bundle
          path: ./dist

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
